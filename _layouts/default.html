<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page.subtitle | default: site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body class="{{ page.collection | default: page.layout | default: 'default' }}">

  <!-- ========================= -->
  <!-- HEADER + NAVIGATION -->
  <!-- ========================= -->
  <header class="site-header">
    {% include nav.html %}
  </header>

  <!-- ========================= -->
  <!-- MAIN CONTENT -->
  <!-- ========================= -->
  <main class="container">
    {{ content }}
  </main>

  <!-- ========================= -->
  <!-- FOOTER -->
  <!-- ========================= -->
  <footer class="site-footer">
    <small>&copy; {{ site.time | date: "%Y" }} {{ site.title }} — Built with Jekyll</small>

    <div class="footer-links">
      <a href="{{ '/about-me/' | relative_url }}">About Me</a>
      <span>•</span>
      <a href="https://github.com/{{ site.github_username }}/{{ site.repository }}">
        GitHub Repo
      </a>
    </div>
  </footer>

</body>
</html>
