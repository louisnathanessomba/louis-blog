<section class="section-hero">
  <div class="section-hero-inner">

    {% if include.portrait %}
      <img src="{{ include.portrait | relative_url }}"
           alt="{{ include.alt | default: include.title }}"
           class="section-hero-portrait"
           loading="lazy">
    {% endif %}

    <div class="section-hero-text">

      <h1 class="section-hero-title">{{ include.title }}</h1>

      {% if include.subtitle %}
        <p class="section-hero-subtitle">{{ include.subtitle }}</p>
      {% endif %}

      {% if include.description %}
        <p class="section-hero-description">{{ include.description }}</p>
      {% endif %}

    </div>

  </div>
</section>
