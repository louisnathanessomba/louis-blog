<nav class="nav" aria-label="Main navigation">
  <div class="nav-inner">

    <!-- Logo / Site Title -->
    <a href="{{ '/' | relative_url }}" class="nav-logo">
      {{ site.title }}
    </a>

    <!-- Navigation Links -->
    <ul class="nav-list">

      <!-- Home link -->
      <li class="nav-item">
        <a href="{{ '/' | relative_url }}"
           class="nav-link {% if page.url == '/' %}active{% endif %}">
          Home
        </a>
      </li>

      <!-- Dynamic navigation items from _config.yml -->
      {% for item in site.nav %}
        {% if item.url and item.name %}
          <li class="nav-item">
            <a href="{{ item.url | relative_url }}"
               class="nav-link {% if page.url == item.url %}active{% endif %}">
              {{ item.name }}
            </a>
          </li>
        {% endif %}
      {% endfor %}

    </ul>

  </div>
</nav>
